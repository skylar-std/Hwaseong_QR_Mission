<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>수원 화성 · QR 역사 미션</title>
  <meta name="description" content="수원 화성 곳곳의 QR 코드를 통해 확인하는 정조 역사 미션" />
  <link rel="icon" type="image/png" href="./img/favicon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://skylar-std.github.io/Hwaseong_QR_Mission//" />
  <meta property="og:title" content="수원 화성 · QR 역사 미션" />
  <meta property="og:description" content="수원 화성 곳곳의 QR 코드를 통해 확인하는 정조 역사 미션" />
  <meta property="og:image" content="./img/og-image.png" />
  <meta property="og:image:alt" content="수원 화성 역사 미션" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;600;700;800&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="obang-strip" aria-hidden="true">
      <span class="b"></span><span class="r"></span><span class="y"></span><span class="w"></span><span class="k"></span>
    </div>

    <header class="hero">
      <div class="badge">SUWON HWASEONG</div>
      <h1>화성 <span class="accent">역사</span> 미션</h1>
      <p class="subtitle">현장 QR을 스캔한 뒤,<br />표지판에 적힌 문제 입장 번호를 입력하세요.</p>
    </header>

    <!-- ───────── 상시 노출 미션 지도 (메인 화면) ───────── -->
    <section class="card" aria-labelledby="board-label-main">
      <div class="card-title">
        <span class="dot yellow"></span>
        <span id="board-label-main">미션 지도</span>
      </div>
      <div class="board-frame">
        <div class="board mission-board" role="img" aria-label="10×10 미션 지도. 찾은 단서 위치가 밝게 표시됩니다."></div>
      </div>
      <div class="board-caption">
        <span>찾은 단서는 노랗게 빛나요 ✨</span>
        <span class="found-count"><span class="found-count-num">0</span> / <span class="total-count-num">16</span></span>
      </div>
    </section>

    <section class="card" aria-labelledby="clue-label">
      <div class="card-title">
        <span class="dot blue"></span>
        <span id="clue-label"> 문제 입장 번호 입력</span>
      </div>
      <label for="clue-input">예: 0000</label>
      <form id="clue-form" class="input-row" autocomplete="off">
        <input
          id="clue-input"
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          placeholder="단서 번호"
          maxlength="10"
          aria-describedby="clue-hint"
        />
        <button type="submit" class="btn-primary">확인</button>
      </form>
      <p id="clue-hint" class="hint">
        숫자로 된 단서 번호를 입력하면 문제에 입장할 수 있어요.
      </p>
    </section>

    <section class="card">
      <div class="card-title">
        <span class="dot red"></span>
        <span>미션 안내</span>
      </div>
      <p class="hint" style="margin-top: 0; font-size: 0.85rem; color: #333;">
        ① 행사장 곳곳의 QR 코드를 찾아보세요.<br />
        ② QR 코드 아래 <strong>문제 입장 번호</strong>를 확인하세요.<br />
        ③ 종이에 정답을 작성한 뒤, 숨겨진 단어를 찾아주세요!
      </p>
    </section>

    <footer class="note">© 수원 화성 역사 미션</footer>
  </div>

  <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="quiz-title" hidden>
    <article class="quiz-popup">
      <header class="quiz-header">
        <span id="quiz-tag" class="quiz-tag">단서</span>
        <h2 id="quiz-title">퀴즈</h2>
        <button type="button" class="btn-close" id="btn-close" aria-label="닫기">×</button>
      </header>
      <div class="quiz-body">
        <!-- ───────── 미션 지도 (오버레이 안에도 동일하게 노출) ───────── -->
        <section class="card" aria-labelledby="board-label-modal" style="margin-bottom: 0;">
          <div class="card-title">
            <span class="dot yellow"></span>
            <span id="board-label-modal">미션 지도</span>
          </div>
          <div class="board-frame">
            <div class="board mission-board" data-mode="current" role="img" aria-label="10×10 미션 지도. 지금 확인한 단서 위치가 밝게 표시됩니다."></div>
          </div>
        </section>

        <div id="quiz-question" class="quiz-question"></div>
      </div>
    </article>
  </div>

  <div id="toast" class="toast" role="alert" aria-live="polite"></div>
  <script src="./js/script.js"></script>
</body>
</html>
